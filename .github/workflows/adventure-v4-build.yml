name: Adventure v4 Android build

on:
  push:
    branches: [ adventure-v4 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: ./gradlew android:assembleDebug android:assembleRelease --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pd-adventure-v4-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pd-adventure-v4-release-unsigned
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error
