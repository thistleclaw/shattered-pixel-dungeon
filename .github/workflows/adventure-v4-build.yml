name: Adventure v4 Android build

on:
  push:
    branches: [ adventure-v4 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Adventure localization placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn '%[sd]' core/src/main/assets/messages/adventure; then
            echo '::error::Adventure I18NBundle strings must use {0}/{1} MessageFormat placeholders, not printf-style %s/%d.'
            exit 1
          fi

      - name: Build debug and release APKs
        run: ./gradlew android:assembleDebug android:assembleRelease --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pd-adventure-v4-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-pd-adventure-v4-release-unsigned
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Export Android apksigner
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          mkdir -p /tmp/apksigner-tool/lib
          cp "$BUILD_TOOLS/apksigner" /tmp/apksigner-tool/
          cp "$BUILD_TOOLS/lib/apksigner.jar" /tmp/apksigner-tool/lib/

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: /tmp/apksigner-tool
          if-no-files-found: error
