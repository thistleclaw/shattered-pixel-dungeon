buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {

    ext {
        appName = 'Shattered Pixel Dungeon: Adventure'
        appPackageName = 'com.thistleclaw.shatteredpd.adventure'

        //Adventure Mode uses its own package/version line, separate from upstream.
        appVersionCode = 913
        appVersionName = '4.0.0-adventure1'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 16
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 16

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}
